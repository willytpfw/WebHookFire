services:
  webhookfire:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: webhookfire
    ports:
      - "3001:3001"
    volumes:
      - webhookfire_db:/app/server/db
    environment:
      - NODE_ENV=production
      - PORT=3001
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://localhost:3001/api/webhooks" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  webhookfire_db:
